<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Survey - Offers by Deepak</title>

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      text-align: center;
    }

    .container {
      padding: 40px 20px;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 10px;
    }

    p {
      font-size: 16px;
      opacity: 0.9;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      color: black;
      padding: 25px;
      border-radius: 15px;
      max-width: 350px;
      margin: auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      color: white;
      text-decoration: none;
      border-radius: 25px;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    .note {
      margin-top: 15px;
      font-size: 13px;
      color: gray;
    }

    footer {
      margin-top: 40px;
      font-size: 13px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>🎁Fill yor details Get Offer</h1>
  <p>Answer simple questions and unlock special deals</p>

  <div class="card">
    <h3>Quick Survey</h3>
    <p>Click below and Confirm order to continue</p>

    <a href="https://surveymars.com/q/lxKMizMir" target="_blank" class="btn">
      Confirm Order 🚀
    </a>

    <div class="note">
      ⏳ Takes only 1–2 minutes
    </div>
  </div>

  <footer>
    © 2026 Offers by Deepak
  </footer>
</div>

</body>
</html>
